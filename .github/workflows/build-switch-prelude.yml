name: Build Dying Light Prelude prototype

on:
  push:
    paths:
      - "switch-prelude/**"
      - ".github/workflows/build-switch-prelude.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO
        run: cd switch-prelude && make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: dying-light-prelude-nro
          path: switch-prelude/dying-light-prelude.nro
